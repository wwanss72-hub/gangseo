<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14102b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대림절 묵상">
<title>강서교회 대림절 묵상</title>
<style>
:root{--bg:#e9e5f0;--card:#ffffff;--tx:#241c3d;--mut:#6d6585;--ac:#5a3d99;--ln:#ddd7ea;--flame:#e8a826;--wax:#efe8da;--p:#6b4aa8;--r:#d9799c;--c1:#4a2a8c;--c2:#a68be0;--c3:#e0589a;--c4:#f6bcd3;--c5:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14102b;--card:#1f1a3d;--tx:#ece8f6;--mut:#a79fc2;--ac:#b9a1ee;--ln:#342d5a;--p:#8d6fd0;--r:#e58aab;--c1:#6a45b8;--c2:#b9a1ee;--c3:#ee6fa5;--c4:#f7c3d8;--c5:#f6f1e6}}
:root[data-theme="dark"]{--bg:#14102b;--card:#1f1a3d;--tx:#ece8f6;--mut:#a79fc2;--ac:#b9a1ee;--ln:#342d5a;--p:#8d6fd0;--r:#e58aab;--c1:#6a45b8;--c2:#b9a1ee;--c3:#ee6fa5;--c4:#f7c3d8;--c5:#f6f1e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;line-height:1.75}
main{max-width:560px;margin:0 auto;padding:20px 18px 56px}
h1{font-size:1.8rem;margin:0;font-weight:700;letter-spacing:-.01em;cursor:default;user-select:none;text-align:center}
.sub{color:var(--mut);font-size:.9rem;margin:2px 0 0;text-align:center}
.candles{display:flex;gap:26px;justify-content:center;align-items:flex-end;margin:26px 0 8px;height:96px}
.c{width:20px;border-radius:3px 3px 2px 2px;position:relative;background:var(--p);opacity:.45;height:56px}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
.c5{background:var(--c5);box-shadow:inset 0 0 0 1px var(--ln)}
.c.on{opacity:1}
.c.on::before{content:"";position:absolute;left:50%;top:-24px;width:12px;height:22px;margin-left:-6px;background:var(--flame);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;box-shadow:0 0 16px 4px rgba(232,168,38,.55);animation:fl 2.4s ease-in-out infinite}
.c::after{content:"";position:absolute;left:50%;top:-4px;width:2px;height:5px;margin-left:-1px;background:var(--tx);opacity:.6}
@keyframes fl{50%{transform:scale(.92,1.06) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.c.on::before{animation:none}}
.wk{text-align:center;color:var(--mut);font-size:.88rem;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:22px 20px}
.date{color:var(--mut);font-size:.85rem}
.ref{font-size:1.7rem;font-weight:700;margin:4px 0 2px;line-height:1.3}
.word{display:inline-block;color:var(--ac);font-size:.92rem;margin:0 0 12px}
.txt{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin:12px 0;font-size:1.02rem}
.ins{margin:14px 0}
.q{background:var(--bg);border-radius:10px;padding:12px 14px;margin:14px 0}
.q b{display:block;font-size:.85rem;color:var(--ac);margin-bottom:2px}
textarea{width:100%;min-height:96px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);padding:10px 12px;font:inherit;font-size:.95rem;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:0;background:var(--ac);color:var(--bg);font-weight:700;font-size:1rem}
.btn.done{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.prog{margin-top:18px;padding-top:16px;border-top:1px solid var(--ln)}
.ph{display:flex;justify-content:space-between;align-items:baseline;font-size:.88rem;color:var(--mut)}
.ph b{font-size:1.25rem;color:var(--tx)}
.bar{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p),var(--r),var(--flame));animation:grow .7s ease-out}
@keyframes grow{from{width:0}}
.pn{font-size:.82rem;color:var(--mut);text-align:right}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:22px}
.d{aspect-ratio:1;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:.88rem;position:relative;padding:0}
.d.sel{border:2px solid var(--ac);font-weight:700}
.d.done::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--flame)}
.d:disabled{opacity:.35;cursor:default}
.note{text-align:center;color:var(--mut);font-size:.85rem;margin-top:16px}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:.9rem}
.banner{background:var(--card);border:1px dashed var(--ac);border-radius:12px;padding:12px 14px;margin-bottom:14px;text-align:center;font-size:.92rem}
.logo-box { text-align: center; margin: 16px 0 8px; }
.logo-box img { max-width: 180px; height: auto; border-radius: 0%; object-fit: cover; }
</style>
</head>
<body>
<main>
<h1 id="ttl">2026 강서교회 대림절 묵상</h1>
<p class="sub">11월 29일 – 12월 25일 · 하루 한 구절</p>
<div class="candles" id="candles" aria-hidden="true"></div>
<div class="wk" id="wk"></div>
<div id="banner"></div>
<section class="card" id="card"></section>
<div class="grid" id="grid" role="list"></div>
<button class="btn" id="a2hs" style="margin-top:15px; margin-bottom:1px;">홈 화면에 저장하기</button>
<div class="card" id="a2hsBox" hidden style="margin-top:12px;font-size:.95rem"></div>  
<div class="row"><button id="share">친구에게 공유하기</button><button id="theme">화면 모드 바꾸기</button></div>
<div class="logo-box">
<img src="logo2.png" alt="교회 로고">
</div>
<p class="note" id="foot"></p>
</main>
<script>
// ===== 설정 =====
const START = new Date(2026, 10, 29); // 2026-11-29 (대림절 첫째 주일)
const WEEKS = [["첫째 주","소망"],["둘째 주","평화"],["셋째 주","기쁨"],["넷째 주","사랑"]];
const D = [
["이사야 64:1–9","","산이 높아지는 날, 모든 민족이 ‘올라간다’. 대림은 올라가서 그분의 길을 배우는 계절입니다.","오늘 내가 배우고 싶은 ‘그분의 길’ 한 가지는?","교회력으로 새해를 여는 대림절 첫 주일, 이사야 선지자는 닫힌 하늘을 향해 “하늘을 찢고 내려오소서”라며 간절히 절규합니다. 이 기도는 단순한 기다림이 아니라, 오래된 단절을 끊어달라는 공동체의 탄식입니다.
하나님께서는 이 절규에 아들을 보내시는 것으로 응답하셨습니다. 예수께서 세례 받으실 때 하늘이 갈라졌고, 십자가에서 숨을 거두실 때 성전 휘장이 위에서 아래로 찢어지며 하나님과 우리 사이를 가로막던 장벽이 완전히 무너졌습니다. 
이제 우리에게 필요한 것은 종말의 날짜를 계산하는 불안한 긴장이 아니라, 맡겨진 일상을 성실히 살아내는 ‘깨어 있음’의 자세입니다. 우리의 완벽한 경계심이 아니라 우리를 끝까지 붙드시는 하나님의 신실하심을 의지하며, 오늘 삶의 자리에서 주님의 오심을 기쁨으로 준비하는 복된 대림절이 되시기를 축원합니다."],
["시편 130:5–6","쇼메림(파수꾼)","파수꾼은 아침이 올 것을 알기에 어둠을 견딥니다. 기다림은 수동이 아니라 깨어 있음입니다.","지금 내 삶에서 ‘아침을 기다리는’ 자리는 어디인가요?",""],
["이사야 40:1–5","나함(위로하라)","‘위로하라’는 명령이 겹쳐 나옵니다. 이 위로는 감정이 아니라 왕이 오신다는 소식입니다.","오늘 누구에게 ‘왕이 오신다’는 소식을 전할까요?",""],
["하박국 2:1–3","미흐마흐마(더딜지라도)","‘더디다’는 머뭇거린다는 뜻입니다. 하나님의 약속은 늦는 듯해도 지각하지 않습니다.","응답이 더딘 기도 하나를 오늘 다시 올려드린다면?",""],
["로마서 13:11–14","카이로스(때)","시계의 시간이 아니라 결정적인 때입니다. 구원은 잠에서 깨어나는 일부터 가까워집니다.","오늘 내가 깨어나야 할 영역은?",""],
["예레미야애가 3:21–26","","폐허 한복판에서 ‘그러나’가 터져 나옵니다. 아침마다 새로운 인자하심이 소망의 근거입니다.","내 삶의 ‘그러나’를 한 문장으로 고백해 봅시다.",""],
["이사야 9:1–2","","큰 빛은 어둠이 사라진 뒤가 아니라 어둠 한가운데로 옵니다.","내 안의 어두운 자리에 빛이 들어오도록 열어둘 문은?",""],
["이사야 11:1–5","게젤(그루터기)","잘려 나간 다윗 가문의 그루터기에서 싹이 납니다. 하나님은 끝난 자리에서 시작하십니다.","끝났다고 여긴 그루터기가 내게 있나요?",""],
["이사야 11:6–9","","이리와 어린 양이 함께 눕는 샬롬의 그림. 평화는 힘의 균형이 아니라 질서의 회복입니다.","내가 먼저 화해의 걸음을 내디딜 관계는?",""],
["말라기 3:1–3","","오시는 분은 연단하는 불과 같습니다. 대림은 위로의 계절이자 정결의 계절입니다.","오늘 내려놓고 싶은 불순물 하나는?",""],
["마태복음 3:1–6","메타노에오(돌이키다)","회개는 후회가 아니라 방향 전환입니다. 광야의 외침은 길을 고르라는 초대입니다.","어느 방향으로 몸을 돌려야 할까요?",""],
["누가복음 1:76–79","스플랑크논(긍휼)","‘긍휼’은 창자가 끓는 사랑입니다. 높은 곳에서 돋는 해가 우리 발을 평강의 길로 인도합니다.","내가 걷는 길에서 평강은 어떤 모습인가요?",""],
["미가 5:2–5a","베들레헴(떡집)","‘떡집’이라는 이름의 작은 마을에서 생명의 떡이 오십니다. 하나님은 작은 곳을 택하십니다.","내 일상의 작은 자리에서 그분을 만나려면?",""],
["빌립보서 4:6–7","","평강은 염려가 없는 상태가 아니라 마음을 ‘지켜 주는’ 보호입니다.","오늘 감사함으로 아뢸 염려 하나는?",""],
["스바냐 3:14–17","야길(기뻐하다)","기뻐 노래하시는 분은 하나님이십니다. 우리의 기쁨보다 그분의 기쁨이 먼저입니다.","하나님이 나를 보고 기뻐하신다는 말이 믿어지나요?",""],
["누가복음 1:39–45","","두 여인이 만나자 아기가 뜁니다. 기쁨은 홀로가 아니라 만남 속에서 터집니다.","오늘 기쁨을 나눌 한 사람은?",""],
["누가복음 1:46–55","","마리아의 노래는 낮은 자를 높이시는 뒤집힌 세상의 노래입니다.","내 삶에서 하나님이 이미 뒤집으신 일은?",""],
["이사야 35:1–6","","광야가 꽃을 피우고 약한 손이 힘을 얻습니다. 기쁨은 마른 땅에서 먼저 시작됩니다.","메마른 곳에 피어날 꽃을 상상해 봅시다.",""],
["시편 126:1–6","","눈물로 씨를 뿌리는 이가 기쁨으로 거둡니다. 기쁨은 눈물을 건너뛰지 않고 통과합니다.","지금 눈물로 뿌리는 씨는 무엇인가요?",""],
["누가복음 1:26–38","게노이토(이루어지이다)","마리아의 응답은 체념이 아니라 초대에 대한 열린 ‘예’입니다.","하나님께 ‘그대로 이루어지이다’ 하고 말할 일은?",""],
["느헤미야 8:9–10","마오즈(산성·힘)","여호와를 기뻐함이 너희의 힘, 곧 산성이라고 선포합니다. 기쁨은 기분이 아니라 피난처입니다.","오늘 기쁨이 나의 피난처가 되려면?",""],
["마태복음 1:18–25","임마누엘","요셉의 조용한 순종이 ‘우리와 함께 계신 하나님’의 문을 엽니다.","오늘 ‘함께 계심’을 느낀 순간은?",""],
["요한일서 4:9–12","","사랑은 우리가 먼저 사랑한 것이 아니라 그분이 먼저 보내신 것입니다.","오늘 받은 사랑을 누구에게 흘려보낼까요?",""],
["요한복음 1:1–5, 14","에스케노센(장막을 치다)","말씀이 육신이 되어 ‘장막을 치셨다’. 광야의 성막처럼 우리 곁에 머무십니다.","그분이 장막을 치실 공간이 내 삶에 있나요?",""],
["빌립보서 2:5–8","에케노센(비우다)","스스로 비우심이 사랑의 모양입니다. 높아지려는 세상에서 낮아짐의 길을 보이십니다.","오늘 내가 비워야 할 것은?",""],
["누가복음 2:1–7","카탈뤼마(객실)","‘여관에 방이 없었다’는 말은 손님방이 없었다는 뜻일 수 있습니다. 구유는 가장 낮은 자리의 환대입니다.","내 마음의 ‘객실’은 누구에게 열려 있나요?",""],
["누가복음 2:8–20","","첫 소식은 밤을 지키던 목자들에게 갑니다. 성탄은 ‘너희를 위한 구주’의 선포입니다.","오늘 이 기쁜 소식을 누구에게 전할까요?",""]
];

// ===== 상태 =====
const KEY = "advent2026";
let S = {done:{},notes:{}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY)||"{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const $ = id => document.getElementById(id);
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const wkOf = i => i<7?0:i<14?1:i<21?2:3;
const dateOf = i => new Date(START.getFullYear(), START.getMonth(), START.getDate()+i);
const fmt = d => `${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
let preview = false, taps = 0;
const cur = () => Math.round((day0(new Date())-START)/864e5);
let sel = Math.min(Math.max(cur(),0),D.length-1);
const unlocked = i => preview || i <= cur();

function render(){
  const c = cur(), i = sel, w = wkOf(i), d = D[i];
  const st = x => x>=26?4:wkOf(x);
  $("candles").innerHTML = [0,1,2,3,4].map(k => `<div class="c c${k+1}${((preview?st(i):st(Math.min(c,26)))>=k && (c>=0||preview))?" on":""}"></div>`).join("");
  $("wk").textContent = i===26 ? "성탄절 · 임마누엘" : `대림 ${WEEKS[w][0]} · ${WEEKS[w][1]}의 촛불`;
  $("banner").innerHTML = (c<0 && !preview) ? `<div class="banner">대림절은 ${-c}일 뒤인 11월 29일에 시작합니다.<br>첫째 날 말씀을 미리 살짝 볼 수 있어요.</div>` : (c>26 ? `<div class="banner">대림절 여정을 마쳤습니다. 지난 말씀을 언제든 다시 읽어 보세요.</div>` : "");
  const ok = unlocked(i) || i===0;
  const dn = !!S.done[i];
  const cnt = Object.keys(S.done).length, pct = Math.round(cnt/D.length*100);
  $("card").innerHTML = `
    <div class="date">${i+1}일째 · ${fmt(dateOf(i))}</div>
    <div class="ref">${d[0]}</div>
    ${d[1] ? `<div class="word">${d[1]}</div>` : ""}
    ${d[4] ? `<div class="txt">${d[4]}</div>` : `<p class="note" style="text-align:left;margin:8px 0">성경을 펼쳐 ${d[0]}을(를) 천천히 두 번 읽어 보세요.</p>`}
    <p class="ins">${d[2]}</p>
    <div class="q"><b>오늘의 질문</b>${d[3]}</div>
    <label for="memo" class="date">나의 묵상 메모 (이 기기에만 저장됩니다)</label>
    <textarea id="memo" placeholder="한두 줄이면 충분합니다."></textarea>
    <button class="btn${dn?" done":""}" id="done">${dn?"읽음 ✓ (눌러서 취소)":"오늘 묵상 마쳤어요"}</button>
    <div class="prog" role="progressbar" aria-label="묵상 진행률" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
      <div class="ph"><span>나의 묵상 진행률</span><b>${pct}%</b></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="pn">${cnt} / ${D.length}일 완료</div>
    </div>`;
  $("memo").value = S.notes[i]||"";
  $("memo").oninput = e => { S.notes[i]=e.target.value; save(); };
  $("done").onclick = () => { S.done[i]=!S.done[i]; if(!S.done[i]) delete S.done[i]; save(); render(); };
  
  const lead = START.getDay();
  let g = "";
  for(let k=0;k<lead;k++) g += "<span></span>";
  for(let k=0;k<D.length;k++){
    const lock = !(unlocked(k) || k===0);
    g += `<button class="d${k===i?" sel":""}${S.done[k]?" done":""}" data-i="${k}" ${lock?"disabled":""} aria-label="${fmt(dateOf(k))}">${dateOf(k).getDate()}</button>`;
  }
  $("grid").innerHTML = g;
  $("grid").querySelectorAll(".d").forEach(b => b.onclick = () => { sel=+b.dataset.i; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  const n = Object.keys(S.done).length;
  $("foot").textContent = `지금까지 ${n}일 묵상했습니다. 날짜가 되면 다음 말씀이 열립니다.`;
}

$("ttl").onclick = () => { if(++taps>=7){ taps=0; preview=!preview; render(); } };
$("share").onclick = async () => {
  const data = {title:"2026 대림절 묵상", text:"하루 한 구절, 대림절 묵상에 함께해요.", url:location.href};
  try { if(navigator.share){ await navigator.share(data); } else { await navigator.clipboard.writeText(location.href); $("foot").textContent="주소를 복사했습니다."; } } catch(e){}
};
$("theme").onclick = () => {
  const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = r.dataset.theme || (dark ? "dark" : "light");
  r.dataset.theme = now==="dark" ? "light" : "dark";
};

// 홈 화면 저장 (안드로이드 자동 프롬프트 지원을 위한 매니페스트 동적 생성 포함)
(function(){
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 180;
    const g = c.getContext("2d");
    g.fillStyle = "#14102b"; g.fillRect(0, 0, 180, 180);
    g.fillStyle = "#6b4aa8"; g.fillRect(78, 88, 24, 62);
    g.fillStyle = "#e8a826"; g.beginPath(); g.ellipse(90, 66, 10, 18, 0, 0, 7); g.fill();
    const iconUrl = c.toDataURL("image/png");

    const l = document.createElement("link");
    l.rel = "apple-touch-icon";
    l.href = iconUrl;
    document.head.appendChild(l);

    // 크롬 등 안드로이드 환경에서 바로 홈화면 추가 창이 뜨도록 돕는 웹앱 매니페스트 동적 추가
    const manifest = {
      name: "2026 남학교회 대림절 묵상",
      short_name: "대림절묵상",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#14102b",
      theme_color: "#14102b",
      icons: [{ src: iconUrl, sizes: "180x180", type: "image/png" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const ml = document.createElement("link");
    ml.rel = "manifest";
    ml.href = URL.createObjectURL(blob);
    document.head.appendChild(ml);
  } catch(e){}
})();

const UA = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isAnd = /Android/i.test(UA), inApp = /KAKAOTALK|NAVER|FBAN|FBAV|Instagram|Line\//i.test(UA);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let dp = null;

addEventListener("beforeinstallprompt", e => { e.preventDefault(); dp = e; });
if (standalone) $("a2hs").hidden = true;

$("a2hs").onclick = async () => {
  const b = $("a2hsBox");
  // 1. 안드로이드 크롬 등 브라우저가 자동 설치를 지원하는 경우 바로 창 띄우기
  if (dp) { 
    dp.prompt(); 
    try { await dp.userChoice; } catch(e){} 
    dp = null; 
    return; 
  }
  
  // 2. 이미 열려있던 안내 상자가 있다면 닫기
  if (!b.hidden) { b.hidden = true; return; }
  
  // 3. 브라우저가 자동 창을 지원하지 않거나(아이폰, 인앱 등) 이벤트가 아직 안 잡힌 경우 안내문 표시
  let h;
  if (inApp) h = `<b>다른 브라우저로 열어 주세요.</b><p style="margin:6px 0 0">지금은 카카오톡 등 앱 안의 브라우저라서 직접 저장할 수 없습니다. 화면 구석의 ⋯ 또는 ⋮ 메뉴에서 <b>‘다른 브라우저로 열기’</b>를 눌러 아이폰은 Safari, 안드로이는 Chrome에서 열고 다시 눌러 주세요.</p>`;
  else if (isIOS) h = `<b>아이폰에서 저장하기 (Safari)</b><ol style="margin:6px 0 0;padding-left:1.2em"><li>화면 아래(또는 위)의 <b>공유 버튼</b>(□에 ↑ 화살표)을 누릅니다.</li><li><b>‘홈 화면에 추가’</b>를 고릅니다.</li><li>오른쪽 위 <b>‘추가’</b>를 누르면 아이콘이 생깁니다.</li></ol>`;
  else if (isAnd) h = `<b>안드로이드에서 저장하기 (Chrome)</b><ol style="margin:6px 0 0;padding-left:1.2em"><li>오른쪽 위 <b>⋮ 메뉴</b>를 누릅니다.</li><li><b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b>를 고릅니다.</li><li><b>‘추가’</b>를 누르면 아이콘이 생깁니다.</li></ol>`;
  else h = `<b>스마트폰에서 열어 주세요.</b><p style="margin:6px 0 0">이 주소를 아이폰(Safari) 또는 안드로이드(Chrome)로 열고 다시 눌러 주세요.</p>`;
  
  b.innerHTML = h;
  b.hidden = false;
  b.scrollIntoView({behavior:"smooth",block:"nearest"});
};

render();
</script>
</body>
</html>
